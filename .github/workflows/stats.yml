name: Update README Cards

on:
  schedule:
    - cron: "0 0 * * *" # Berjalan setiap hari
  workflow_dispatch: # Memungkinkan menjalankan manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ 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 }} # <-- Gunakan PAT di sini

      # 1. Generate GitHub Stats Card (Gunakan PAT_TOKEN)
      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ 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 }} # <-- Ganti ke PAT_TOKEN

      # 2. Generate Top Languages Card (Gunakan PAT_TOKEN)
      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ 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 }} # <-- Ganti ke PAT_TOKEN

      # 3. Generate Trophy Card (Gunakan Action Resmi yang Lebih Stabil)
      - name: Generate Trophy
        uses: ryo-ma/github-profile-trophy@master # <-- Action resmi
        with:
          username: ${{ github.repository_owner }}
          token: ${{ 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 }} # <-- Gunakan PAT_TOKEN
          file: profile/trophy.svg
          theme: tokyonight
          max-rows: 1

      # 4. Commit dan Push perubahan
      - name: Commit Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
